name: Deploy portfolio

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify site files
        run: test -s site/index.html

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::726862573245:role/GitHubPortfolioDeploy
          aws-region: us-east-1

      - name: Read infrastructure outputs
        shell: bash
        run: |
          set -euo pipefail
          outputs=$(aws cloudformation describe-stacks \
            --stack-name portfolio-site \
            --query 'Stacks[0].Outputs' \
            --output json)

          bucket=$(jq -er '.[] | select(.OutputKey == "BucketName") | .OutputValue' <<< "$outputs")
          distribution=$(jq -er '.[] | select(.OutputKey == "DistributionId") | .OutputValue' <<< "$outputs")

          echo "SITE_BUCKET=$bucket" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$distribution" >> "$GITHUB_ENV"

      - name: Upload site to S3
        run: aws s3 sync ./site "s3://$SITE_BUCKET" --delete

      - name: Refresh CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
